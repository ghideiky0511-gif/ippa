# Configuração Fly.io do frontend (Next.js standalone).
#
# BACKEND_INTERNAL_URL usa a URL pública do backend por enquanto. A rede
# privada 6PN (.internal/.flycast) entrega tráfego entre Machines via IPv6
# (fdaa:...), e o server.ts hoje escuta só em IPv4 (HOSTNAME=0.0.0.0) — o
# tráfego público funciona porque passa pelo proxy da própria Fly, que
# redireciona por loopback IPv4 dentro da VM, mas conexão direta de outra
# Machine via 6PN cai em "connection refused". Pra usar a rede privada (e
# evitar esse round-trip público entre os dois apps) seria necessário mudar
# o server.ts pra escutar em "::" (dual-stack) — ver discussão na migração
# antes de fazer essa mudança de código.
#
# NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_REALTIME_URL vão para o bundle do
# navegador, então precisam ser definidas em tempo de BUILD, não aqui em
# [env] (que só afeta o processo em runtime). Preencha [build.args] abaixo
# com a URL pública final antes de rodar `fly deploy`, ou passe via
# `fly deploy --build-arg NEXT_PUBLIC_APP_URL=... --build-arg NEXT_PUBLIC_REALTIME_URL=...`.
app = "ippa-frontend"
primary_region = "gru"

[build]
  [build.args]
    NEXT_PUBLIC_APP_URL = "https://catalogo.bippa.com.br"
    NEXT_PUBLIC_REALTIME_URL = "https://ippa-backend.fly.dev"

[env]
  PORT = "3015"
  HOSTNAME = "0.0.0.0"
  BACKEND_INTERNAL_URL = "https://ippa-backend.fly.dev"

[http_service]
  internal_port = 3015
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
