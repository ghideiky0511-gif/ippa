# Configuração Fly.io do frontend (Next.js standalone).
#
# BACKEND_INTERNAL_URL usa Flycast: endereço privado do backend que passa
# pelo proxy do Fly sem sair pra internet. Diferente de ippa-backend.internal
# (conexão direta numa Machine, e o Node usa só o primeiro IP da lista), o
# Flycast distribui as chamadas SSR entre todas as Machines do backend e para
# de mandar tráfego pra uma Machine com health check falhando.
#
# Pré-requisitos, nesta ordem, antes do deploy do frontend:
#   1. `fly ips allocate-v6 --private -a ippa-backend` (uma vez só) — sem esse
#      IP privado, ippa-backend.flycast não resolve e todo SSR falha.
#   2. Backend no ar com force_https = false (ver backend/fly.toml): o Flycast
#      só fala HTTP, na porta 80 do http_service.
#
# NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_REALTIME_URL vão para o bundle do
# navegador, então precisam ser definidas em tempo de BUILD, não aqui em
# [env] (que só afeta o processo em runtime). Preencha [build.args] abaixo
# com a URL pública final antes de rodar `fly deploy`, ou passe via
# `fly deploy --build-arg NEXT_PUBLIC_APP_URL=... --build-arg NEXT_PUBLIC_REALTIME_URL=...`.
app = "ippa-frontend"
primary_region = "gru"

[build]
  [build.args]
    NEXT_PUBLIC_APP_URL = "https://catalogo.bippa.com.br"
    NEXT_PUBLIC_REALTIME_URL = "https://ippa-backend.fly.dev"

[env]
  PORT = "3015"
  HOSTNAME = "0.0.0.0"
  BACKEND_INTERNAL_URL = "http://ippa-backend.flycast"

[http_service]
  internal_port = 3015
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  # 256mb no MVP: o next-server usa ~90MB de RSS, sobra ~110MB.
  memory = "256mb"
