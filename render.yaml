# Blueprint do Render. Conecta este repositório em Render → New → Blueprint
# para sincronizar com os serviços existentes (o Render casa pelo campo
# `name`, então os nomes abaixo têm que bater com os serviços já criados no
# painel). Variáveis de ambiente NÃO listadas aqui continuam do jeito que
# estão configuradas no painel — este arquivo só cuida da conexão automática
# entre frontend e backend.
services:
  - type: web
    name: ippa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

  - type: web
    name: ippa-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Resolvidos automaticamente pelo Render a partir do serviço
      # `ippa-backend` a cada deploy — nada de host/porta hardcoded.
      - key: BACKEND_INTERNAL_HOST
        fromService:
          type: web
          name: ippa-backend
          property: host
      - key: BACKEND_INTERNAL_PORT
        fromService:
          type: web
          name: ippa-backend
          property: port
